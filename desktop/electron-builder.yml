appId: com.workdayescape.poc
productName: Workday Escape
directories:
  output: release
  buildResources: packaging
files:
  - out/**
  - package.json
asar: true
afterPack: scripts/after-pack.cjs
electronDist: node_modules/electron/dist
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  executableName: Workday Escape
  requestedExecutionLevel: asInvoker
portable:
  artifactName: Workday-Escape-${version}-win-${arch}.${ext}
  requestExecutionLevel: user
  unpackDirName: false
